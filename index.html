<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liga MX Grid — Fútbol 11</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131a26;
      --panel-2: #1a2333;
      --border: #263247;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --danger: #ef4444;
      --gold: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #131d31 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
      max-width: 720px;
      width: 100%;
    }

    header h1 {
      font-size: 1.85rem;
      letter-spacing: 0.5px;
      font-weight: 800;
      color: #fff;
    }

    header h1 span {
      color: var(--accent);
    }

    header p {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 4px;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .pill {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill strong {
      color: var(--accent);
    }

    .btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 15px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary {
      background: var(--accent);
      color: #052e16;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #052e16;
    }

    .board-wrapper {
      width: 100%;
      max-width: 680px;
      overflow-x: auto;
    }

    .grid-board {
      display: grid;
      grid-template-columns: 120px repeat(3, 1fr);
      gap: 8px;
      min-width: 460px;
    }

    .corner-cell {
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      padding: 6px;
    }

    .header-cell {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 92px;
      gap: 5px;
    }

    .header-badge {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 0.5px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    .header-title {
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.2;
      color: #f8fafc;
    }

    .header-sub {
      font-size: 0.68rem;
      color: var(--muted);
    }

    .play-cell {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 106px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
      position: relative;
    }

    .play-cell:hover:not(.solved):not(.locked) {
      border-color: var(--accent);
      background: #202c40;
      transform: translateY(-2px);
    }

    .play-cell .plus {
      font-size: 1.5rem;
      color: var(--muted);
      font-weight: 300;
    }

    .play-cell.solved {
      background: linear-gradient(145deg, #123524, #0d261a);
      border-color: var(--accent);
      cursor: default;
    }

    .play-cell.missed {
      background: linear-gradient(145deg, #33161a, #220f12);
      border-color: var(--danger);
      cursor: default;
    }

    .solved-name {
      font-weight: 700;
      font-size: 0.86rem;
      color: #fff;
      line-height: 1.2;
    }

    .solved-meta {
      font-size: 0.72rem;
      color: #86efac;
      margin-top: 4px;
    }

    .missed-meta {
      font-size: 0.7rem;
      color: #fca5a5;
      margin-top: 4px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.8);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
    }

    .modal-criteria {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.35rem;
      cursor: pointer;
      line-height: 1;
    }

    .search-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .suggestions {
      margin-top: 10px;
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .suggestion-item {
      background: var(--panel-2);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: 0.12s;
    }

    .suggestion-item:hover {
      border-color: var(--accent);
      background: #233047;
    }

    .suggestion-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .suggestion-era {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .feedback {
      margin-top: 10px;
      font-size: 0.84rem;
      min-height: 20px;
      color: #fca5a5;
      font-weight: 600;
    }

    .summary-box {
      margin-top: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      max-width: 680px;
      width: 100%;
      display: none;
      text-align: center;
    }

    .summary-box.visible {
      display: block;
    }
  </style>
</head>

FLAGS.ger = { name: "Alemania", badge: "🇩🇪", bg: "#0f172a", fg: "#facc15" };
FLAGS.por = { name: "Portugal", badge: "🇵🇹", bg: "#15803d", fg: "#dc2626" };

const PLAYERS = RAW_DB.map(([name, teams, nats, ach, era]) => ({
  name,
  teams,
  nats,
  ach: ach.split(""),
  era
}));

function normalizeText(str) {
  return str
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();
}

function matchesCriterion(player, crit) {
  if (crit.type === "team") return player.teams.includes(crit.id);
  if (crit.type === "nat") return player.nats.includes(crit.id);
  if (crit.type === "ach") return player.ach.includes(crit.id);
  return false;
}

function buildAllCriteria() {
  const list = [];
  Object.entries(TEAMS).forEach(([id, t]) => {
    list.push({ type: "team", id, label: t.name, sub: "Club Liga MX", badge: t.short, bg: t.bg, fg: t.fg });
  });
  ["mex", "arg", "bra", "col", "uru", "chi", "ecu", "par", "esp"].forEach(id => {
    const f = FLAGS[id];
    list.push({ type: "nat", id, label: f.name, sub: "Nacionalidad", badge: f.badge, bg: f.bg, fg: f.fg });
  });
  Object.entries(ACHIEVEMENTS).forEach(([id, a]) => {
    list.push({ type: "ach", id, label: a.name, sub: "Logro / Carrera", badge: a.short, bg: a.bg, fg: a.fg });
  });
  return list;
}

let rows = [];
let cols = [];
let cells = Array(9).fill(null);
let guessesLeft = 9;
let gameOver = false;
let activeCellIndex = null;

function generateValidBoard() {
  const all = buildAllCriteria();
  for (let attempt = 0; attempt < 500; attempt++) {
    const shuffled = [...all].sort(() => Math.random() - 0.5);
    const candRows = [];
    const candCols = [];

    for (const c of shuffled) {
      if (candRows.length < 3) {
        if (c.type === "ach" && candRows.some(x => x.type === "ach")) continue;
        candRows.push(c);
      } else if (candCols.length < 3) {
        if (c.type === "nat" && candRows.some(x => x.type === "nat")) continue;
        if (c.type === "ach" && candRows.some(x => x.type === "ach")) continue;
        if (c.type === "ach" && candCols.some(x => x.type === "ach")) continue;
        candCols.push(c);
      } else {
        break;
      }
    }

    if (candRows.length < 3 || candCols.length < 3) continue;

    let ok = true;
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        const validPlayers = PLAYERS.filter(p => matchesCriterion(p, candRows[r]) && matchesCriterion(p, candCols[c]));
        if (validPlayers.length === 0) {
          ok = false;
          break;
        }
      }
      if (!ok) break;
    }

    if (ok) {
      rows = candRows;
      cols = candCols;
      return;
    }
  }
}

function renderBoard() {
  const board = document.getElementById("gridBoard");
  board.innerHTML = "";

  const corner = document.createElement("div");
  corner.className = "corner-cell";
  corner.innerHTML = "LIGA MX<br><strong>3×3</strong>";
  board.appendChild(corner);

  cols.forEach(col => {
    board.appendChild(createHeaderCell(col));
  });

  for (let r = 0; r < 3; r++) {
    board.appendChild(createHeaderCell(rows[r]));
    for (let c = 0; c < 3; c++) {
      const idx = r * 3 + c;
      const cellData = cells[idx];
      const cell = document.createElement("div");
      cell.className = "play-cell";

      if (cellData) {
        if (cellData.status === "solved") {
          cell.classList.add("solved");
          cell.innerHTML = `
            <div class="solved-name">${cellData.player.name}</div>
            <div class="solved-meta">${cellData.player.era}</div>
          `;
        } else if (cellData.status === "missed") {
          cell.classList.add("missed");
          cell.innerHTML = `
            <div class="solved-name">${cellData.sample}</div>
            <div class="missed-meta">Ejemplo válido</div>
          `;
        }
      } else {
        if (gameOver) cell.classList.add("locked");
        cell.innerHTML = `<span class="plus">+</span>`;
        if (!gameOver) {
          cell.addEventListener("click", () => openCellModal(idx));
        }
      }

      board.appendChild(cell);
    }
  }

  const solvedCount = cells.filter(x => x && x.status === "solved").length;
  document.getElementById("scoreCount").textContent = `${solvedCount} / 9`;
  document.getElementById("guessesLeft").textContent = guessesLeft;
}

function createHeaderCell(crit) {
  const div = document.createElement("div");
  div.className = "header-cell";
  div.innerHTML = `
    <div class="header-badge" style="background:${crit.bg}; color:${crit.fg};">${crit.badge}</div>
    <div class="header-title">${crit.label}</div>
    <div class="header-sub">${crit.sub}</div>
  `;
  return div;
}

function openCellModal(idx) {
  activeCellIndex = idx;
  const r = Math.floor(idx / 3);
  const c = idx % 3;
  document.getElementById("modalCriteria").textContent = `${rows[r].label} + ${cols[c].label}`;
  document.getElementById("modalFeedback").textContent = "";
  const input = document.getElementById("playerSearch");
  input.value = "";
  renderSuggestions("");
  document.getElementById("modalBackdrop").classList.add("open");
  setTimeout(() => input.focus(), 50);
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("open");
  activeCellIndex = null;
}

function renderSuggestions(query) {
  const list = document.getElementById("suggestionsList");
  list.innerHTML = "";
  const q = normalizeText(query);
  if (q.length < 2) return;

  const usedNames = new Set(
    cells.filter(x => x && x.status === "solved").map(x => x.player.name)
  );

  const matches = PLAYERS.filter(p => !usedNames.has(p.name) && normalizeText(p.name).includes(q)).slice(0, 12);

  matches.forEach(player => {
    const item = document.createElement("div");
    item.className = "suggestion-item";
    item.innerHTML = `
      <span class="suggestion-name">${player.name}</span>
      <span class="suggestion-era">${player.era}</span>
    `;
    item.addEventListener("click", () => submitGuess(player));
    list.appendChild(item);
  });
}

function submitGuess(player) {
  if (activeCellIndex === null || gameOver) return;
  const r = Math.floor(activeCellIndex / 3);
  const c = activeCellIndex % 3;
  const isValid = matchesCriterion(player, rows[r]) && matchesCriterion(player, cols[c]);

  guessesLeft--;

  if (isValid) {
    cells[activeCellIndex] = { status: "solved", player };
    closeModal();
  } else {
    document.getElementById("modalFeedback").textContent = `❌ ${player.name} no cumple ambos criterios (-1 intento).`;
    if (guessesLeft <= 0) {
      closeModal();
    }
  }

  checkEndGame();
  renderBoard();
}

function checkEndGame() {
  const solvedCount = cells.filter(x => x && x.status === "solved").length;
  if (solvedCount === 9 || guessesLeft <= 0) {
    gameOver = true;
    const summary = document.getElementById("summaryBox");
    summary.classList.add("visible");
    summary.innerHTML = solvedCount === 9
      ? `🎉 <strong>¡Tablero perfecto!</strong> Completaste los 9 cuadros de Liga MX.`
      : `🏁 <strong>Juego terminado:</strong> Lograste <strong>${solvedCount} / 9</strong> aciertos. Pulsa "Rendirse / Ver respuestas" o "Nuevo tablero".`;
  }
}

function revealAll() {
  gameOver = true;
  for (let i = 0; i < 9; i++) {
    if (!cells[i]) {
      const r = Math.floor(i / 3);
      const c = i % 3;
      const valid = PLAYERS.filter(p => matchesCriterion(p, rows[r]) && matchesCriterion(p, cols[c]));
      cells[i] = { status: "missed", sample: valid[0] ? valid[0].name : "N/A" };
    }
  }
  renderBoard();
}

function startNewGame() {
  cells = Array(9).fill(null);
  guessesLeft = 9;
  gameOver = false;
  document.getElementById("summaryBox").classList.remove("visible");
  generateValidBoard();
  renderBoard();
}

document.getElementById("playerSearch").addEventListener("input", e => renderSuggestions(e.target.value));
document.getElementById("closeModalBtn").addEventListener("click", closeModal);
document.getElementById("modalBackdrop").addEventListener("click", e => {
  if (e.target.id === "modalBackdrop") closeModal();
});
document.getElementById("revealBtn").addEventListener("click", revealAll);
document.getElementById("newGameBtn").addEventListener("click", startNewGame);

startNewGame();
</script>
