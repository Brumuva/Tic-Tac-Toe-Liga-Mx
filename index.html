<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liga MX Grid — Fútbol 11</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131a26;
      --panel-2: #1a2333;
      --border: #263247;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --p2: #38bdf8;
      --bot: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #131d31 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 12px 44px;
    }

    header {
      text-align: center;
      margin-bottom: 14px;
      max-width: 760px;
      width: 100%;
    }

    header h1 {
      font-size: 1.8rem;
      letter-spacing: 0.5px;
      font-weight: 800;
      color: #fff;
    }

    header h1 span {
      color: var(--accent);
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .modes-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      max-width: 760px;
      width: 100%;
    }

    .mode-group {
      display: inline-flex;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      gap: 3px;
    }

    .mode-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #052e16;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      max-width: 760px;
      width: 100%;
    }

    .pill {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill strong {
      color: var(--accent);
    }

    .btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.16s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary {
      background: var(--accent);
      color: #052e16;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #052e16;
    }

    .board-wrapper {
      width: 100%;
      max-width: 720px;
      overflow-x: auto;
    }

    .grid-board {
      display: grid;
      grid-template-columns: 124px repeat(3, minmax(110px, 1fr));
      gap: 8px;
      min-width: 470px;
    }

    .corner-cell {
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      padding: 6px;
    }

    .header-cell {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 98px;
      gap: 5px;
    }

    .crest-box {
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .crest-box svg {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
    }

    .header-badge {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    .header-title {
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.2;
      color: #f8fafc;
    }

    .header-sub {
      font-size: 0.68rem;
      color: var(--muted);
    }

    .play-cell {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 108px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
    }

    .play-cell:hover:not(.solved):not(.missed):not(.locked) {
      border-color: var(--accent);
      background: #202c40;
      transform: translateY(-2px);
    }

    .play-cell .plus {
      font-size: 1.55rem;
      color: var(--muted);
      font-weight: 300;
    }

    .play-cell.solved-p1 {
      background: linear-gradient(145deg, #123524, #0d261a);
      border-color: var(--accent);
      cursor: default;
    }

    .play-cell.solved-p2 {
      background: linear-gradient(145deg, #0e2d42, #091d2b);
      border-color: var(--p2);
      cursor: default;
    }

    .play-cell.solved-bot {
      background: linear-gradient(145deg, #3a290b, #241906);
      border-color: var(--bot);
      cursor: default;
    }

    .play-cell.missed {
      background: linear-gradient(145deg, #33161a, #220f12);
      border-color: var(--danger);
      cursor: default;
    }

    .solved-name {
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
      line-height: 1.2;
    }

    .solved-meta {
      font-size: 0.7rem;
      color: #cbd5e1;
      margin-top: 4px;
    }

    .owner-tag {
      margin-top: 4px;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    .missed-meta {
      font-size: 0.7rem;
      color: #fca5a5;
      margin-top: 4px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.82);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 470px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
    }

    .modal-criteria {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.35rem;
      cursor: pointer;
      line-height: 1;
    }

    .search-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .list-label {
      margin-top: 10px;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .suggestions {
      margin-top: 6px;
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .suggestion-item {
      background: var(--panel-2);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: 0.12s;
    }

    .suggestion-item:hover {
      border-color: var(--accent);
      background: #233047;
    }

    .suggestion-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .suggestion-era {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .rec-badge {
      font-size: 0.68rem;
      font-weight: 700;
      color: #86efac;
      background: rgba(34, 197, 94, 0.14);
      padding: 2px 7px;
      border-radius: 999px;
      margin-left: 8px;
    }

    .feedback {
      margin-top: 10px;
      font-size: 0.84rem;
      min-height: 20px;
      color: #fca5a5;
      font-weight: 600;
    }

    .summary-box {
      margin-top: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      max-width: 720px;
      width: 100%;
      display: none;
      text-align: center;
      line-height: 1.45;
    }

    .summary-box.visible {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1>LIGA MX <span>GRID</span></h1>
    <p>Completa la cuadrícula de 3×3 combinando clubes, nacionalidades y logros del fútbol mexicano.</p>
  </header>

  <div class="modes-bar">
    <div class="mode-group" id="modeSelector">
      <button class="mode-btn active" data-mode="solo">Solitario</button>
      <button class="mode-btn" data-mode="p2">2 Jugadores</button>
      <button class="mode-btn" data-mode="bot">VS Bot</button>
    </div>
    <div class="mode-group" id="botDifficultyGroup" style="display: none;">
      <button class="mode-btn active" data-diff="easy">Bot Fácil</button>
      <button class="mode-btn" data-diff="medium">Bot Medio</button>
      <button class="mode-btn" data-diff="hard">Bot Difícil</button>
    </div>
  </div>

  <div class="top-bar">
    <div class="pill" id="turnPill">Turno: <strong id="turnLabel">Jugador 1</strong></div>
    <div class="pill" id="scorePill">Aciertos: <strong id="scoreCount">0 / 9</strong></div>
    <div class="pill" id="guessesPill">Intentos: <strong id="guessesLeft">9</strong></div>
    <button class="btn" id="revealBtn">Rendirse / Ver respuestas</button>
    <button class="btn btn-primary" id="newGameBtn">Nuevo tablero</button>
  </div>

  <div class="board-wrapper">
    <div class="grid-board" id="gridBoard"></div>
  </div>

  <div class="summary-box" id="summaryBox"></div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-criteria" id="modalCriteria">Criterio</div>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <input type="text" class="search-input" id="playerSearch" placeholder="Busca jugador o elige de recomendados..." autocomplete="off" />
      <div class="feedback" id="modalFeedback"></div>
      <div class="list-label" id="listLabel">Recomendados para esta casilla</div>
      <div class="suggestions" id="suggestionsList"></div>
    </div>
  </div>

function getTeamCrestSVG(teamId) {
  const t = TEAMS[teamId];
  if (!t) return "";
  return `
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-label="${t.name}">
      <defs>
        <clipPath id="shield-${teamId}">
          <path d="M12 8 H52 V30 C52 45 32 57 32 57 C32 57 12 45 12 30 Z" />
        </clipPath>
      </defs>
      <g clip-path="url(#shield-${teamId})">
        <rect x="10" y="6" width="44" height="54" fill="${t.p1}" />
        <polygon points="10,6 54,6 10,56" fill="${t.p2}" opacity="0.92" />
        <rect x="25" y="6" width="14" height="54" fill="rgba(255,255,255,0.14)" />
      </g>
      <path d="M12 8 H52 V30 C52 45 32 57 32 57 C32 57 12 45 12 30 Z"
            fill="none" stroke="#f8fafc" stroke-width="2.6" />
      <text x="32" y="34" text-anchor="middle" fill="#ffffff" font-size="11.5"
            font-weight="900" font-family="Arial, sans-serif"
            stroke="#0b0f17" stroke-width="2.2" paint-order="stroke">${t.short}</text>
    </svg>
  `;
}

// Deduplica por nombre combinando clubes y nacionalidades para que ningún jugador se pierda
const mergedMap = new Map();
RAW_DB.forEach(([rawName, teams, nats, ach, era]) => {
  const cleanName = rawName.replace(/\s*\([^)]*\)$/, "").trim();
  const validTeams = teams.filter(id => Boolean(TEAMS[id]));
  const validNats = nats.filter(id => Boolean(FLAGS[id]));
  const validAch = String(ach).toUpperCase().split("").filter(code => Boolean(ACHIEVEMENTS[code]));

  if (!mergedMap.has(cleanName)) {
    mergedMap.set(cleanName, {
      name: cleanName,
      teams: [...new Set(validTeams)],
      nats: [...new Set(validNats)],
      ach: [...new Set(validAch)],
      era
    });
  } else {
    const existing = mergedMap.get(cleanName);
    existing.teams = [...new Set([...existing.teams, ...validTeams])];
    existing.nats = [...new Set([...existing.nats, ...validNats])];
    existing.ach = [...new Set([...existing.ach, ...validAch])];
  }
});

const PLAYERS = [...mergedMap.values()].filter(p => p.teams.length > 0 && p.nats.length > 0);

function normalizeText(str) {
  return str
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();
}

function matchesCriterion(player, crit) {
  if (crit.type === "team") return player.teams.includes(crit.id);
  if (crit.type === "nat") return player.nats.includes(crit.id);
  if (crit.type === "ach") return player.ach.includes(crit.id);
  return false;
}

function getValidPlayersForCell(cellIdx) {
  const r = Math.floor(cellIdx / 3);
  const c = cellIdx % 3;
  return PLAYERS.filter(p => matchesCriterion(p, rows[r]) && matchesCriterion(p, cols[c]));
}

function buildAllCriteria() {
  const list = [];
  Object.entries(TEAMS).forEach(([id, t]) => {
    list.push({ type: "team", id, label: t.name, sub: "Club Liga MX", crestSvg: getTeamCrestSVG(id) });
  });
  const usedNats = new Set(PLAYERS.flatMap(p => p.nats));
  usedNats.forEach(id => {
    const f = FLAGS[id];
    if (f) {
      list.push({ type: "nat", id, label: f.name, sub: "Nacionalidad", badge: f.badge, bg: f.bg, fg: f.fg });
    }
  });
  Object.entries(ACHIEVEMENTS).forEach(([id, a]) => {
    list.push({ type: "ach", id, label: a.name, sub: "Logro / Carrera", badge: a.short, bg: a.bg, fg: a.fg });
  });
  return list;
}

let gameMode = "solo";
let botDifficulty = "easy";
let currentTurn = "p1";
let rows = [];
let cols = [];
let cells = Array(9).fill(null);
let guessesLeft = 9;
let gameOver = false;
let activeCellIndex = null;
let botTimer = null;

function generateValidBoard() {
  const all = buildAllCriteria();
  for (let attempt = 0; attempt < 800; attempt++) {
    const shuffled = [...all].sort(() => Math.random() - 0.5);
    const candRows = [];
    const candCols = [];

    for (const c of shuffled) {
      if (candRows.length < 3) {
        if (c.type === "ach" && candRows.some(x => x.type === "ach")) continue;
        candRows.push(c);
      } else if (candCols.length < 3) {
        if (c.type === "nat" && candRows.some(x => x.type === "nat")) continue;
        if (c.type === "ach" && candRows.some(x => x.type === "ach")) continue;
        if (c.type === "ach" && candCols.some(x => x.type === "ach")) continue;
        candCols.push(c);
      } else {
        break;
      }
    }

    if (candRows.length < 3 || candCols.length < 3) continue;

    let ok = true;
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        const validPlayers = PLAYERS.filter(p => matchesCriterion(p, candRows[r]) && matchesCriterion(p, candCols[c]));
        if (validPlayers.length === 0) {
          ok = false;
          break;
        }
      }
      if (!ok) break;
    }

    if (ok) {
      rows = candRows;
      cols = candCols;
      return;
    }
  }
}

function createHeaderCell(crit) {
  const div = document.createElement("div");
  div.className = "header-cell";
  const visual = crit.crestSvg
    ? `<div class="crest-box">${crit.crestSvg}</div>`
    : `<div class="header-badge" style="background:${crit.bg}; color:${crit.fg};">${crit.badge}</div>`;

  div.innerHTML = `
    ${visual}
    <div class="header-title">${crit.label}</div>
    <div class="header-sub">${crit.sub}</div>
  `;
  return div;
}

function renderBoard() {
  const board = document.getElementById("gridBoard");
  board.innerHTML = "";

  const corner = document.createElement("div");
  corner.className = "corner-cell";
  corner.innerHTML = "LIGA MX<br><strong>3×3</strong>";
  board.appendChild(corner);

  cols.forEach(col => board.appendChild(createHeaderCell(col)));

  for (let r = 0; r < 3; r++) {
    board.appendChild(createHeaderCell(rows[r]));
    for (let c = 0; c < 3; c++) {
      const idx = r * 3 + c;
      const cellData = cells[idx];
      const cell = document.createElement("div");
      cell.className = "play-cell";

      if (cellData) {
        if (cellData.status === "solved") {
          const ownerClass = cellData.owner === "p2" ? "solved-p2" : (cellData.owner === "bot" ? "solved-bot" : "solved-p1");
          const ownerLabel = gameMode === "solo"
            ? ""
            : `<div class="owner-tag">${cellData.owner === "p1" ? "Jugador 1" : (cellData.owner === "p2" ? "Jugador 2" : "Bot")}</div>`;
          cell.classList.add(ownerClass);
          cell.innerHTML = `
            <div class="solved-name">${cellData.player.name}</div>
            <div class="solved-meta">${cellData.player.era}</div>
            ${ownerLabel}
          `;
        } else if (cellData.status === "missed") {
          cell.classList.add("missed");
          cell.innerHTML = `
            <div class="solved-name">${cellData.sample}</div>
            <div class="missed-meta">Ejemplo válido</div>
          `;
        }
      } else {
        const locked = gameOver || (gameMode === "bot" && currentTurn === "bot");
        if (locked) cell.classList.add("locked");
        cell.innerHTML = `<span class="plus">+</span>`;
        if (!locked) {
          cell.addEventListener("click", () => openCellModal(idx));
        }
      }

      board.appendChild(cell);
    }
  }

  const p1Count = cells.filter(x => x && x.status === "solved" && x.owner === "p1").length;
  const p2Count = cells.filter(x => x && x.status === "solved" && x.owner === "p2").length;
  const botCount = cells.filter(x => x && x.status === "solved" && x.owner === "bot").length;
  const totalSolved = p1Count + p2Count + botCount;

  document.getElementById("turnLabel").textContent =
    gameMode === "solo" ? "Solitario" : (currentTurn === "p1" ? "Jugador 1" : (currentTurn === "p2" ? "Jugador 2" : "Bot pensando..."));

  if (gameMode === "p2") {
    document.getElementById("scoreCount").textContent = `J1 ${p1Count} - ${p2Count} J2`;
    document.getElementById("guessesPill").style.display = "none";
  } else if (gameMode === "bot") {
    document.getElementById("scoreCount").textContent = `Tú ${p1Count} - ${botCount} Bot`;
    document.getElementById("guessesPill").style.display = "none";
  } else {
    document.getElementById("scoreCount").textContent = `${totalSolved} / 9`;
    document.getElementById("guessesPill").style.display = "flex";
    document.getElementById("guessesLeft").textContent = guessesLeft;
  }
}

function openCellModal(idx) {
  if (gameOver || (gameMode === "bot" && currentTurn === "bot")) return;
  activeCellIndex = idx;
  const r = Math.floor(idx / 3);
  const c = idx % 3;
  document.getElementById("modalCriteria").textContent = `${rows[r].label} + ${cols[c].label}`;
  document.getElementById("modalFeedback").textContent = "";
  const input = document.getElementById("playerSearch");
  input.value = "";
  renderSuggestions("");
  document.getElementById("modalBackdrop").classList.add("open");
  setTimeout(() => input.focus(), 50);
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("open");
  activeCellIndex = null;
}

function renderSuggestions(query) {
  const list = document.getElementById("suggestionsList");
  const label = document.getElementById("listLabel");
  list.innerHTML = "";
  if (activeCellIndex === null) return;

  const q = normalizeText(query);
  const usedNames = new Set(
    cells.filter(x => x && x.status === "solved").map(x => x.player.name)
  );

  let items = [];
  let isRecommended = false;

  if (!q) {
    const validForCell = getValidPlayersForCell(activeCellIndex).filter(p => !usedNames.has(p.name));
    items = validForCell.slice(0, 8);
    isRecommended = true;
    label.textContent = "Recomendados para esta casilla";
  } else {
    const filtered = PLAYERS.filter(p => !usedNames.has(p.name) && normalizeText(p.name).includes(q));
    const cellValidSet = new Set(getValidPlayersForCell(activeCellIndex).map(p => p.name));
    filtered.sort((a, b) => {
      const aOk = cellValidSet.has(a.name) ? 0 : 1;
      const bOk = cellValidSet.has(b.name) ? 0 : 1;
      return aOk - bOk || a.name.localeCompare(b.name);
    });
    items = filtered.slice(0, 12);
    label.textContent = `Resultados (${filtered.length})`;
  }

  if (items.length === 0) {
    list.innerHTML = `<div class="suggestion-item" style="cursor:default;"><span class="suggestion-era">No hay jugadores disponibles con ese texto.</span></div>`;
    return;
  }

  const cellValidSet = new Set(getValidPlayersForCell(activeCellIndex).map(p => p.name));

  items.forEach(player => {
    const item = document.createElement("div");
    item.className = "suggestion-item";
    const badge = (isRecommended || cellValidSet.has(player.name))
      ? `<span class="rec-badge">Apto</span>`
      : "";
    item.innerHTML = `
      <div><span class="suggestion-name">${player.name}</span>${badge}</div>
      <span class="suggestion-era">${player.era}</span>
    `;
    item.addEventListener("click", () => submitHumanGuess(player));
    list.appendChild(item);
  });
}

function submitHumanGuess(player) {
  if (activeCellIndex === null || gameOver) return;
  const r = Math.floor(activeCellIndex / 3);
  const c = activeCellIndex % 3;
  const isValid = matchesCriterion(player, rows[r]) && matchesCriterion(player, cols[c]);

  if (gameMode === "solo") {
    guessesLeft--;
    if (isValid) {
      cells[activeCellIndex] = { status: "solved", player, owner: "p1" };
      closeModal();
    } else {
      document.getElementById("modalFeedback").textContent = `❌ ${player.name} no cumple ambos criterios (-1 intento).`;
      if (guessesLeft <= 0) closeModal();
    }
    checkEndGame();
    renderBoard();
    return;
  }

  if (gameMode === "p2") {
    if (isValid) {
      cells[activeCellIndex] = { status: "solved", player, owner: currentTurn };
      currentTurn = currentTurn === "p1" ? "p2" : "p1";
      closeModal();
    } else {
      document.getElementById("modalFeedback").textContent = `❌ ${player.name} no cumple. Pasa el turno.`;
      currentTurn = currentTurn === "p1" ? "p2" : "p1";
      renderBoard();
    }
    checkEndGame();
    renderBoard();
    return;
  }

  if (gameMode === "bot") {
    if (isValid) {
      cells[activeCellIndex] = { status: "solved", player, owner: "p1" };
      closeModal();
      checkEndGame();
      renderBoard();
      if (!gameOver) {
        currentTurn = "bot";
        renderBoard();
        scheduleBotMove();
      }
    } else {
      document.getElementById("modalFeedback").textContent = `❌ ${player.name} no cumple. Turno del Bot.`;
      closeModal();
      currentTurn = "bot";
      renderBoard();
      scheduleBotMove();
    }
  }
}

function scheduleBotMove() {
  clearTimeout(botTimer);
  botTimer = setTimeout(() => {
    if (gameOver || gameMode !== "bot" || currentTurn !== "bot") return;
    const freeIndices = [];
    for (let i = 0; i < 9; i++) {
      if (!cells[i]) freeIndices.push(i);
    }
    if (freeIndices.length === 0) {
      checkEndGame();
      return;
    }

    const accuracy = botDifficulty === "easy" ? 0.45 : (botDifficulty === "medium" ? 0.72 : 0.95);
    const chosenIdx = freeIndices[Math.floor(Math.random() * freeIndices.length)];
    const validPlayers = getValidPlayersForCell(chosenIdx);
    const usedNames = new Set(cells.filter(x => x && x.status === "solved").map(x => x.player.name));
    const availableValid = validPlayers.filter(p => !usedNames.has(p.name));

    if (Math.random() < accuracy && availableValid.length > 0) {
      const pick = availableValid[Math.floor(Math.random() * availableValid.length)];
      cells[chosenIdx] = { status: "solved", player: pick, owner: "bot" };
    }

    currentTurn = "p1";
    checkEndGame();
    renderBoard();
  }, 650);
}

function checkEndGame() {
  const solvedCount = cells.filter(x => x && x.status === "solved").length;
  const summary = document.getElementById("summaryBox");

  if (gameMode === "solo") {
    if (solvedCount === 9 || guessesLeft <= 0) {
      gameOver = true;
      summary.classList.add("visible");
      summary.innerHTML = solvedCount === 9
        ? `🎉 <strong>¡Tablero perfecto!</strong> Completaste los 9 cuadros.`
        : `🏁 <strong>Fin de partida:</strong> Lograste <strong>${solvedCount} / 9</strong> aciertos.`;
    }
    return;
  }

  if (solvedCount === 9) {
    gameOver = true;
    const p1 = cells.filter(x => x && x.owner === "p1").length;
    const p2 = cells.filter(x => x && x.owner === "p2").length;
    const bot = cells.filter(x => x && x.owner === "bot").length;
    summary.classList.add("visible");
    if (gameMode === "p2") {
      summary.innerHTML = p1 > p2
        ? `🏆 <strong>¡Gana Jugador 1!</strong> (${p1} a ${p2})`
        : (p2 > p1 ? `🏆 <strong>¡Gana Jugador 2!</strong> (${p2} a ${p1})` : `🤝 <strong>¡Empate!</strong> (${p1} a ${p2})`);
    } else {
      summary.innerHTML = p1 > bot
        ? `🏆 <strong>¡Ganaste al Bot!</strong> (${p1} a ${bot})`
        : (bot > p1 ? `🤖 <strong>¡El Bot ganó!</strong> (${bot} a ${p1})` : `🤝 <strong>¡Empate!</strong> (${p1} a ${bot})`);
    }
  }
}

function revealAll() {
  clearTimeout(botTimer);
  gameOver = true;
  const usedNames = new Set(cells.filter(x => x && x.status === "solved").map(x => x.player.name));
  for (let i = 0; i < 9; i++) {
    if (!cells[i]) {
      const valid = getValidPlayersForCell(i);
      const unused = valid.find(p => !usedNames.has(p.name)) || valid[0];
      cells[i] = { status: "missed", sample: unused ? unused.name : "N/A" };
    }
  }
  renderBoard();
}

function startNewGame() {
  clearTimeout(botTimer);
  cells = Array(9).fill(null);
  guessesLeft = 9;
  currentTurn = "p1";
  gameOver = false;
  document.getElementById("summaryBox").classList.remove("visible");
  document.getElementById("summaryBox").innerHTML = "";
  generateValidBoard();
  renderBoard();
}

document.querySelectorAll("#modeSelector .mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#modeSelector .mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    gameMode = btn.dataset.mode;
    document.getElementById("botDifficultyGroup").style.display = gameMode === "bot" ? "inline-flex" : "none";
    startNewGame();
  });
});

document.querySelectorAll("#botDifficultyGroup .mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#botDifficultyGroup .mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    botDifficulty = btn.dataset.diff;
    startNewGame();
  });
});

document.getElementById("playerSearch").addEventListener("input", e => renderSuggestions(e.target.value));
document.getElementById("closeModalBtn").addEventListener("click", closeModal);
document.getElementById("modalBackdrop").addEventListener("click", e => {
  if (e.target.id === "modalBackdrop") closeModal();
});
document.getElementById("revealBtn").addEventListener("click", revealAll);
document.getElementById("newGameBtn").addEventListener("click", startNewGame);

startNewGame();
</script>
